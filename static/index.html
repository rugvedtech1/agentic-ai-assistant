<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agentic AI Research Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2rem;
      color: #7c6ef5;
      margin-bottom: 8px;
    }

    .header p {
      color: #888;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 720px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1rem;
      color: #7c6ef5;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #e0e0e0;
      padding: 14px;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
      outline: none;
    }

    textarea:focus { border-color: #7c6ef5; }

    select {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #e0e0e0;
      padding: 12px 14px;
      font-size: 1rem;
      margin-top: 16px;
      outline: none;
      cursor: pointer;
    }

    .file-label {
      display: block;
      margin-top: 16px;
      padding: 12px 14px;
      background: #0f0f1a;
      border: 1px dashed #2a2a4a;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      color: #888;
      transition: border-color 0.2s;
    }

    .file-label:hover { border-color: #7c6ef5; color: #7c6ef5; }

    #image-input { display: none; }

    #file-name {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #7c6ef5;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #7c6ef5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    .btn:hover { background: #6a5ce0; }
    .btn:disabled { background: #444; cursor: not-allowed; }

    .agents {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .agent-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      color: #888;
      transition: all 0.3s;
    }

    .agent-badge.active {
      background: #7c6ef5;
      border-color: #7c6ef5;
      color: white;
    }

    .result-box {
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.7;
      min-height: 100px;
      color: #ccc;
    }

    .status-bar {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .status-bar.success { color: #4caf50; }
    .status-bar.error { color: #f44336; }
    .status-bar.loading { color: #7c6ef5; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🤖 Agentic AI Research Assistant</h1>
    <p>Multi-Agent System — Planner · Search · Vision · Summarizer · Report</p>
  </div>

  <!-- Input Card -->
  <div class="card">
    <h2>Your Query</h2>
    <textarea id="query" placeholder="Ask anything... e.g. What is LangGraph and how does it work?"></textarea>

    <select id="model">
      <option value="gpt-4o-mini">GPT-4o Mini (Fast)</option>
      <option value="gpt-4o">GPT-4o (Powerful)</option>
      <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Economy)</option>
    </select>

    <label class="file-label" for="image-input">
      📎 Upload Image (optional — for Vision Agent)
    </label>
    <input type="file" id="image-input" accept="image/*" onchange="showFileName(this)"/>
    <div id="file-name"></div>

    <button class="btn" id="submit-btn" onclick="submitQuery()">
      🚀 Run Agent Pipeline
    </button>
  </div>

  <!-- Output Card -->
  <div class="card" id="output-card">
    <h2>Agent Pipeline</h2>

    <div class="agents">
      <div class="agent-badge" id="badge-planner">🧠 Planner</div>
      <div class="agent-badge" id="badge-search">🔍 Search</div>
      <div class="agent-badge" id="badge-vision">👁️ Vision</div>
      <div class="agent-badge" id="badge-summarizer">📝 Summarizer</div>
      <div class="agent-badge" id="badge-report">📊 Report</div>
    </div>

    <div class="status-bar" id="status">Waiting for query...</div>

    <div class="result-box" id="result">
Your research report will appear here after the agents complete their work.
    </div>
  </div>

  <script>
    function showFileName(input) {
      const name = input.files[0]?.name || '';
      document.getElementById('file-name').textContent = name ? `Selected: ${name}` : '';
    }

    function resetBadges() {
      ['planner','search','vision','summarizer','report'].forEach(a => {
        document.getElementById('badge-' + a).classList.remove('active');
      });
    }

    async function animateAgents(steps) {
      resetBadges();
      for (let i = 0; i < steps.length; i++) {
        await new Promise(r => setTimeout(r, 400));
        const badge = document.getElementById('badge-' + steps[i]);
        if (badge) badge.classList.add('active');
      }
    }

    async function submitQuery() {
      const query = document.getElementById('query').value.trim();
      if (!query) { alert('Please enter a query!'); return; }

      const model = document.getElementById('model').value;
      const imageInput = document.getElementById('image-input');
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      // Reset UI
      resetBadges();
      btn.disabled = true;
      btn.textContent = '⏳ Running agents...';
      status.className = 'status-bar loading';
      status.textContent = 'Pipeline running...';
      result.textContent = 'Agents are working on your query...';

      // Build form data
      const formData = new FormData();
      formData.append('query', query);
      formData.append('model', model);
      if (imageInput.files[0]) {
        formData.append('image', imageInput.files[0]);
      }

      try {
        const response = await fetch('/query', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        // Animate agent badges
        await animateAgents(data.steps || []);

        if (data.status === 'success') {
          status.className = 'status-bar success';
          status.textContent = `✅ Completed — ${data.steps?.length || 0} agents ran successfully`;
          result.textContent = data.result || 'No result returned';
        } else {
          status.className = 'status-bar error';
          status.textContent = '❌ Pipeline failed';
          result.textContent = data.error || 'Unknown error occurred';
        }

      } catch (err) {
        status.className = 'status-bar error';
        status.textContent = '❌ Connection error';
        result.textContent = 'Could not connect to the API. Make sure the server is running.';
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Run Agent Pipeline';
      }
    }
  </script>

</body>
</html>
